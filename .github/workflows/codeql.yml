name: CodeQL

# This scans the code for common security mistakes automatically --
# on every push, every pull request, and once a week on its own, just
# in case a new kind of mistake gets discovered later that the old
# code would now trigger.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday at 03:17 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # lets this job publish results to the Security tab
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
